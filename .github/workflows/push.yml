name: Push gem to RubyGems

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  push:
    if: github.repository == 'avdi/naught'
    runs-on: ubuntu-latest
    environment:
      name: rubygems.org
      url: https://rubygems.org/gems/naught
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          # Sigstore signing fails on Ruby 4.0, whose json 3 rejects options
          # that protobug 0.1.0 passes to JSON.parse. Use 3.4 until it's fixed.
          ruby-version: '3.4'
          bundler-cache: true
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Update RubyGems
        run: gem update --system
      - name: Build gem
        run: bundle exec rake build
      - name: Sign gem with Sigstore
        run: gem exec sigstore-cli sign pkg/*.gem --bundle pkg/naught.gem.sigstore.json
      - name: Push gem
        run: gem push pkg/*.gem --attestation pkg/naught.gem.sigstore.json
      - name: Wait for release
        run: gem exec rubygems-await pkg/*.gem
