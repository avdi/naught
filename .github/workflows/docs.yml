name: Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  yard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Generate YARD documentation
        run: bundle exec rake yard
      - name: Verify YARD documentation coverage
        run: bundle exec rake yardstick
